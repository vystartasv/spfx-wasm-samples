{"id":"wasm-change-radar","title":"SharePoint Change Radar","purpose":"Review read-only page and URL impact before retiring, moving, renaming, or replacing a target.","wasm":{"used":false,"engine":"none","assets":"none"},"baseline":"Native TypeScript URL graph analysis","execution":"Versioned typed RPC to a dedicated worker; the worker extracts references, traverses reverse reachability, detects cycles, and returns deterministic results.","network":"Demo fixture makes no network request. A typed current-site GET-only adapter boundary is present as an explicit stub; no Graph, external fetch, telemetry, or persistence.","sharepoint":{"writes":false,"boundary":"Typed read-only current-site adapter boundary only; the checked-in adapter is a stub and has no POST, PUT, PATCH, DELETE, upload, or SharePoint write path."},"privacy":"Page URLs and content are processed in the browser and are not persisted or sent to external services. Tenant permissions, browser extensions, host instrumentation, and SharePoint logging remain outside this sample's control.","limits":"Demo scans are bounded to 80 pages, 64 KiB of content per page, 50 references per page, and 5 adapter page requests; target and replacement URLs must be same-site.","claims":[{"status":"VERIFIED","text":"The deterministic fixture, URL normalization, reference extraction, graph impact, cycle detection, warnings, stable export, and worker contract are covered by repository tests."},{"status":"VERIFIED","text":"The checked-in adapter contract creates only bounded same-site GET request descriptions and has no write or Graph operation."},{"status":"EXPECTED","text":"A dedicated worker keeps extraction and graph traversal off the UI thread when the packaged web part runs."},{"status":"NOT SUPPORTED","text":"The current-site adapter is a typed stub; tenant completeness, permission visibility, browser compatibility, production information architecture decisions, and any WASM performance advantage are not claimed."}],"maturity":"L2","licensing":{"notice":"../../LICENSE","dependencies":[]}}
